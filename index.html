<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b6b4d"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>دليلك — ملء الاستمارات</title>
<style>
:root{--bg:#f3f4f6;--fg:#111;--card:#fff;--ac:#0b6b4d;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#1c1f23;--fg:#eee;--card:#2a2e33;--bd:#454a50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px "Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
h1{font-size:18px;margin:0 0 10px} h2{font-size:15px;margin:14px 0 6px;color:var(--ac)}
label{display:block;font-size:13px;margin:6px 0 2px}
input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
input.sel{outline:2px solid var(--ac)}
.row{display:flex;gap:14px;align-items:center;margin:6px 0}
button{font:inherit;padding:7px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sheet{width:100%;max-width:210mm;background:#fff;box-shadow:0 2px 12px #0004;margin:0 auto}
.sheet svg{display:block;width:100%;height:auto}
#cal{display:none;font-size:12px;direction:ltr;text-align:left;margin-top:8px;white-space:pre-wrap}
.cal #cal{display:block}
text{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,"DejaVu Sans",Arial,sans-serif;font-weight:bold;fill:#0a1a8c}
.calx{display:none} .cal .calx{display:inline}
.bb,#pad{display:none}#pad{position:fixed;left:8px;bottom:8px;z-index:9;gap:6px;align-items:center;direction:ltr;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px}#pad button{width:44px;height:44px;font-size:18px}body.cal #pad{display:flex}
@media(max-width:900px){input[type=text]{font-size:16px}.app{padding:8px 8px 70px}body.pv .panel{display:none}body:not(.pv) main{display:none}
.bb{display:flex;position:fixed;bottom:0;left:0;right:0;gap:6px;padding:8px;background:var(--card);border-top:1px solid var(--bd);z-index:9}.bb button{flex:1;padding:12px 4px}#pad{bottom:64px}}
.rv{background:#fff3b0!important}.ocr{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}.ocr small{font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media print{
  .bb,#pad{display:none!important}body:not(.pv) main{display:block!important}
  .ocr{display:none}
  @page{size:210mm 297mm;margin:0}
  html,body{margin:0;background:#fff}
  .panel,.calx{display:none!important}
  .app{display:block;padding:0}
  .sheet{width:210mm;max-width:none;margin:0;box-shadow:none}
}
</style></head>
<body>
<div class="app" id="app">
  <aside class="panel">
    <h1>دليلك — <span id="ttl"></span></h1>

}
function drawChecks() {

}

    const p = pos(f);
    el('rect', { x: f.left, y: f.y - 24, width: f.right - f.left, height: 28, fill: f.id === sel ? '#0b6b4d33' : '#2563eb14', stroke: f.id === sel ? '#0b6b4d' : '#2563eb55', 'stroke-width': 1 }, guides);
    if (f.id === sel) el('line', { x1: f.left, x2: f.right, y1: p.y, y2: p.y, stroke: '#e11d48', 'stroke-width': 1 }, guides);

}
function renderAll() { T.fields.forEach(fit); drawChecks(); drawGuides(); calInfo(); }

// ---- نموذج الإدخال ----
const form = $('#form');
for (const s in T.sections) {
  form.insertAdjacentHTML('beforeend', `<h2>${T.sections[s]}</h2>`);
  { const r = document.createElement('div'); r.className = 'ocr';
    const mk = (txt, cap) => { const b = document.createElement('button'); b.textContent = txt;
      const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*'; if (cap) fi.setAttribute('capture', 'environment'); fi.hidden = true;
      b.onclick = () => fi.click(); fi.onchange = () => { if (fi.files[0]) readCard(s, fi.files[0], st); fi.value = ''; }; r.append(b, fi); };
    const st = document.createElement('small'); mk('📷 تصوير البطاقة', true); mk('🖼 من المعرض', false); r.append(st);
    form.appendChild(r); }
  T.fields.filter(f => f.s === s).forEach(f => {
    const l = document.createElement('label'); l.textContent = f.label;
    const i = document.createElement('input'); i.type = 'text'; i.id = 'in_' + f.id; i.autocomplete = 'off';
    i.dir = f.dir; i.value = data[f.id] || '';

    l.appendChild(i); form.appendChild(l);
    if (f.id === 'h_rent') form.insertAdjacentHTML('beforeend',
      `<div class="row"><b>نوع السكن:</b><label><input type="radio" name="hs" value="private"> خاص</label><label><input type="radio" name="hs" value="rented"> إيجاري</label></div>`);

}
document.querySelectorAll('input[name=hs]').forEach(r => { r.checked = data.housing === r.value; r.onchange = () => { data.housing = r.value; drawChecks(); save(); }; });
function save() { try { sessionStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
try { if (!data.h_nin && !location.search.includes('demo')) data = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
function clearData() { data = {}; save(); form.querySelectorAll('input[type=text]').forEach(i => i.value = ''); document.querySelectorAll('input[name=hs]').forEach(r => r.checked = false); renderAll(); }

// ---- المعايرة: الأسهم 0.5 مم، Alt+سهم 0.1 مم ----
function toggleCal() { calOn = !calOn; document.getElementById('app').classList.toggle('cal', calOn); document.body.classList.toggle('cal', calOn); renderAll(); }
function calInfo() {
  if (!calOn) return;
  const f = T.fields.find(x => x.id === sel);
  const info = document.createElement('div'); info.textContent = f ? `${f.id}  dx=${off(f).dx.toFixed(2)}px (${(off(f).dx/MM).toFixed(2)}mm)  dy=${off(f).dy.toFixed(2)}px (${(off(f).dy/MM).toFixed(2)}mm) — الأسهم 0.5mm، Alt+الأسهم 0.1mm` : 'انقر حقلًا في المعاينة أو اكتب فيه، ثم حرّكه بالأسهم.';
  $('#cal').innerHTML = ''; $('#cal').append(info);
  const b1 = document.createElement('button'); b1.textContent = 'نسخ الإزاحات JSON'; b1.onclick = () => { const s = JSON.stringify(cal, null, 1); navigator.clipboard && navigator.clipboard.writeText(s); prompt('انسخ والصق في dx/dy داخل القالب:', s); };
  const b2 = document.createElement('button'); b2.textContent = 'تصفير المعايرة'; b2.onclick = () => { cal = {}; localStorage.removeItem(KEY + '.cal'); renderAll(); };
  $('#cal').append(b1, b2); $('#padl').textContent = f ? f.id : 'اختر حقلًا';
}
sv.addEventListener('click', e => {
  if (!calOn) return;
  const r = sv.getBoundingClientRect(), x = (e.clientX - r.left) * T.width / r.width, y = (e.clientY - r.top) * T.width / r.width;
  const f = T.fields.find(f => x >= f.left && x <= f.right && y >= f.y - 24 && y <= f.y + 4);
  if (f) { sel = f.id; const i = $('#in_' + f.id); i && i.focus(); drawGuides(); calInfo(); }
});
function nudge(mx, my, fine) {
  if (!calOn || !sel) return; const st = (fine ? 0.1 : 0.5) * MM, f = T.fields.find(x => x.id === sel), o = off(f);
  cal[sel] = { dx: o.dx + mx * st, dy: o.dy + my * st }; try { localStorage.setItem(KEY + '.cal', JSON.stringify(cal)); } catch (x) {}
  fit(f); drawGuides(); calInfo();
}
addEventListener('keydown', e => { const m = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }[e.key]; if (m && calOn && sel) { e.preventDefault(); nudge(m[0], m[1], e.altKey); } });
document.querySelectorAll('#pad button').forEach(b => b.onclick = () => { const [x, y] = b.dataset.d.split(',').map(Number); nudge(x, y); });
function tab(v) { document.body.classList.toggle('pv', !!v); scrollTo(0, 0); }
function doPrint() { if (matchMedia('(max-width:900px)').matches && !document.body.classList.contains('pv')) tab(1); setTimeout(() => print(), 250); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

// ================= قراءة بطاقة التعريف (محليًا على الجهاز، Tesseract.js) =================
const norm = t => t.replace(/[\u064B-\u065F\u0640]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const A = '[اإأآ]', LBL = new RegExp('لقب|ال' + A + 'سم|تاريخ|مكان|رقم|الجنس|سلطة|الميلاد|ال' + A + 'صدار|ال' + A + 'نتهاء');
const arClean = t => t.replace(/[^\u0621-\u064A\s\-]/g, ' ').replace(/\s*-\s*/g, ' ').replace(/\s+/g, ' ').trim();
function parseCard(raw) {
  const lines = norm(raw).split(/\n/).map(l => l.trim()).filter(Boolean), out = {};
  for (const l of lines) { const d = l.replace(/[\s.\-:]/g, '').match(/\d{16,20}/); if (d) { out.nin = d[0]; out.ninWarn = d[0].length !== 18; if (!out.ninWarn) break; } }
  const ds = [...norm(raw).matchAll(/(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/g)].map(m => ({ y: +m[1], m: +m[2], d: +m[3] })).filter(x => x.y > 1900 && x.m >= 1 && x.m <= 12 && x.d >= 1 && x.d <= 31).sort((a, b) => a.y - b.y || a.m - b.m || a.d - b.d);
  if (ds[0]) out.birthdate = String(ds[0].d).padStart(2, '0') + '/' + String(ds[0].m).padStart(2, '0') + '/' + ds[0].y;
  const after = re => {
    const i = lines.findIndex(l => re.test(l)); if (i < 0) return '';
    let v = arClean(lines[i].replace(new RegExp('^.*?' + re.source), ''));
    for (let k = 1; v.length < 2 && k <= 2 && lines[i + k]; k++) { const c = lines[i + k]; if (!LBL.test(c) && !/\d{4}/.test(c)) v = arClean(c); }
    return LBL.test(v) ? '' : v;
  };
  out.last = after(/لقب/); out.first = after(new RegExp('ال' + A + 'سم')); out.birthplace = after(/مكان\s*الميلاد/);
  return out;
}
let ocrWorker = null;
const loadScript = src => new Promise((ok, no) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = () => no(new Error('ملف ناقص: ' + src)); document.head.appendChild(e); });
async function getWorker(st) {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await loadScript('ocr/tesseract.min.js');
  const u = p => new URL(p, location.href).href;
  ocrWorker = await Tesseract.createWorker('ara', 1, { workerPath: u('ocr/worker.min.js'), corePath: u('ocr'), langPath: u('ocr'), gzip: false, workerBlobURL: false, cacheMethod: 'none',
    logger: m => { if (m.status && st) st.textContent = 'جارٍ القراءة… ' + m.status + (m.progress ? ' ' + Math.round(m.progress * 100) + '%' : ''); } });
  return ocrWorker;
}
async function prepImage(file) {   // تصغير وتحسين تباين فقط؛ الصورة لا تُحفظ ولا تُرسل
  const bm = await createImageBitmap(file), k = Math.min(1, (innerWidth < 900 ? 1600 : 2000) / Math.max(bm.width, bm.height));
  const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
  const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.35)'; x.drawImage(bm, 0, 0, c.width, c.height); return c;
}
async function readCard(s, file, st) {
  try {
    st.textContent = 'تجهيز الصورة…'; const img = await prepImage(file), w = await getWorker(st);
    let r = parseCard((await w.recognize(img)).data.text);
    if (!(r.nin && r.birthdate && r.last && r.first && r.birthplace)) {
      await w.setParameters({ tessedit_pageseg_mode: '11' }); const r2 = parseCard((await w.recognize(img)).data.text);
      await w.setParameters({ tessedit_pageseg_mode: '3' }); for (const k in r2) if (!r[k]) r[k] = r2[k];
    }
    let n = 0;
    for (const k of ['nin', 'last', 'first', 'birthdate', 'birthplace']) if (r[k]) { const id = s + '_' + k, f = T.fields.find(x => x.id === id), i = $('#in_' + id);
      data[id] = r[k]; i.value = r[k]; i.classList.add('rv'); i.addEventListener('input', () => i.classList.remove('rv'), { once: true }); fit(f); n++; }
    save(); st.textContent = n ? `استُخرج ${n} من 5 حقول — راجع المظلل بالأصفر قبل الطباعة.` + (r.ninWarn ? ' ⚠ رقم التعريف ليس 18 رقمًا، صححه.' : '') : 'لم أستطع قراءة بيانات واضحة. جرّب صورة أوضح.';
  } catch (e) { st.textContent = 'تعذّرت القراءة: ' + e.message + (location.protocol === 'file:' ? ' — شغّل start.bat بدل فتح الملف مباشرة.' : ' — تأكد من وجود ملفات مجلد ocr (download-ocr.bat).'); }
}
renderAll();
document.fonts && document.fonts.ready.then(renderAll);
